<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>💌 Sophia</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Georgia', serif;
    }

    /* ─── GAME SCREEN ─── */
    #game-screen {
      position: fixed;
      inset: 0;
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: opacity 0.6s ease;
    }

    #game-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #stars-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #strawberry {
      position: absolute;
      font-size: clamp(56px, 18vw, 96px);
      cursor: pointer;
      user-select: none;
      transition: transform 0.08s ease;
      filter: drop-shadow(0 0 12px rgba(255, 80, 100, 0.55));
      line-height: 1;
      touch-action: none;
      z-index: 2;
    }

    #strawberry:active {
      transform: scale(0.85);
    }

    #open-btn {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0);
      z-index: 2;
      background: linear-gradient(135deg, #e8629a, #c0395f);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 16px 36px;
      font-size: clamp(15px, 4.5vw, 20px);
      font-family: 'Georgia', serif;
      letter-spacing: 0.03em;
      cursor: pointer;
      box-shadow: 0 4px 24px rgba(232, 98, 154, 0.55);
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.2s ease;
      white-space: nowrap;
    }

    #open-btn.visible {
      transform: translate(-50%, -50%) scale(1);
    }

    #open-btn:active {
      box-shadow: 0 2px 12px rgba(232, 98, 154, 0.4);
      transform: translate(-50%, -50%) scale(0.95);
    }

    #touch-hint {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.3);
      font-size: 13px;
      letter-spacing: 0.05em;
      z-index: 2;
      pointer-events: none;
      transition: opacity 0.4s;
    }

    /* ─── MUSIC BUTTON ─── */
    #music-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 100;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s, background 0.2s, transform 0.15s;
    }

    #music-btn.visible {
      opacity: 1;
      pointer-events: all;
    }

    #music-btn:active {
      background: rgba(232, 98, 154, 0.3);
      transform: scale(0.88);
    }

    /* ─── CAROUSEL SCREEN ─── */
    #carousel-screen {
      position: fixed;
      inset: 0;
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s ease 0.3s;
    }

    #carousel-screen.visible {
      opacity: 1;
      pointer-events: all;
    }

    #stars-canvas-2 {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .carousel-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .poem-card {
      --accent:    #f472b6;
      --glow:      rgba(244,114,182,0.18);
      --border:    rgba(244,114,182,0.28);
      --card-bg:   rgba(255,255,255,0.05);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      min-height: clamp(260px, 55vh, 420px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 28px;
      text-align: center;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.35),
                  0 0 0 1px rgba(255,255,255,0.04) inset;
      position: relative;
      overflow: hidden;
      transition: border-color 0.5s ease, box-shadow 0.5s ease;
    }

    .poem-card::before {
      content: '';
      position: absolute;
      top: -60px;
      left: -60px;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
      pointer-events: none;
      transition: background 0.5s ease;
    }

    .poem-icon {
      font-size: 2rem;
      margin-bottom: 18px;
      opacity: 0.9;
    }

    .poem-title {
      color: var(--accent);
      font-size: clamp(14px, 3.8vw, 17px);
      font-style: italic;
      letter-spacing: 0.08em;
      margin-bottom: 18px;
      text-transform: uppercase;
      opacity: 0.85;
      transition: color 0.5s ease;
    }

    /* ─── LILY BACKGROUND ─── */
    #lily-container {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .lily {
      position: absolute;
      pointer-events: none;
      width: var(--size);
      height: var(--size);
      opacity: var(--op);
      animation: lilyDrift ease-in-out infinite;
      transform-origin: center;
      translate: -50% -50%; /* centraliza pelo ponto de ancoragem */
    }

    @keyframes lilyDrift {
      0%   { transform: translateY(0)     rotate(var(--r)); }
      50%  { transform: translateY(-14px) rotate(calc(var(--r) + 6deg)); }
      100% { transform: translateY(0)     rotate(var(--r)); }
    }

    .poem-text {
      color: rgba(255, 255, 255, 0.88);
      font-size: clamp(15px, 4.2vw, 18px);
      line-height: 1.85;
      white-space: pre-line;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      max-height: clamp(160px, 36vh, 300px);
      width: 100%;
      padding-right: 2px;
    }

    .nav-row {
      display: flex;
      align-items: center;
      gap: 20px;
      width: 100%;
      justify-content: center;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      border-radius: 50px;
      padding: 12px 28px;
      font-size: clamp(13px, 3.8vw, 16px);
      font-family: 'Georgia', serif;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      min-width: 105px;
      touch-action: manipulation;
    }

    .nav-btn:active {
      background: rgba(244, 114, 182, 0.25);
      transform: scale(0.94);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      pointer-events: none;
    }

    .counter {
      color: rgba(255, 255, 255, 0.5);
      font-size: 14px;
      min-width: 44px;
      text-align: center;
      letter-spacing: 0.05em;
    }

    .poem-card.slide-out-left  { animation: slideOutLeft  0.3s  ease forwards; }
    .poem-card.slide-out-right { animation: slideOutRight 0.3s  ease forwards; }
    .poem-card.slide-in-right  { animation: slideInRight  0.32s ease forwards; }
    .poem-card.slide-in-left   { animation: slideInLeft   0.32s ease forwards; }

    @keyframes slideOutLeft  { to   { opacity: 0; transform: translateX(-60px); } }
    @keyframes slideOutRight { to   { opacity: 0; transform: translateX(60px);  } }
    @keyframes slideInRight  { from { opacity: 0; transform: translateX(60px);  } to { opacity: 1; transform: translateX(0); } }
    @keyframes slideInLeft   { from { opacity: 0; transform: translateX(-60px); } to { opacity: 1; transform: translateX(0); } }

    .heart {
      position: absolute;
      pointer-events: none;
      user-select: none;
      animation: floatUp linear forwards;
      z-index: 1;
      font-size: 18px;
      opacity: 0;
    }

    @keyframes floatUp {
      0%   { opacity: 0.8; transform: translateY(0) scale(1); }
      100% { opacity: 0;   transform: translateY(-120px) scale(0.5); }
    }

    /* ─── FINAL CARD ─── */
    #final-card {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      --accent:  #f472b6;
      --glow:    rgba(244,114,182,0.22);
      --border:  rgba(244,114,182,0.35);
      --card-bg: rgba(255,255,255,0.05);
    }

    .final-big-icon {
      font-size: 3rem;
      animation: finalPulse 1.6s ease-in-out infinite;
    }

    @keyframes finalPulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.15); }
    }

    .final-name {
      font-size: clamp(26px, 8vw, 40px);
      color: #f472b6;
      font-style: italic;
      letter-spacing: 0.12em;
      text-shadow: 0 0 24px rgba(244,114,182,0.5);
    }

    /* Placeholder da foto — substitua pelo <img> quando tiver a foto */
    #photo-placeholder {
      width: clamp(110px, 32vw, 160px);
      height: clamp(110px, 32vw, 160px);
      border-radius: 50%;
      border: 2px dashed rgba(244,114,182,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      color: rgba(244,114,182,0.4);
      background: rgba(244,114,182,0.05);
    }

    .final-msg {
      color: rgba(255,255,255,0.75);
      font-size: clamp(14px, 4vw, 17px);
      font-style: italic;
      letter-spacing: 0.06em;
      text-align: center;
    }

    /* Confetti */
    .confetti-piece {
      position: fixed;
      top: -24px;
      pointer-events: none;
      z-index: 200;
      animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {
      0%   { transform: translateY(0)    rotate(0deg);   opacity: 1; }
      100% { transform: translateY(105vh) rotate(540deg); opacity: 0; }
    }

    @keyframes hintPulse {
      0%, 100% { opacity: 0.30; }
      50%       { opacity: 0.65; }
    }

    #touch-hint {
      animation: hintPulse 2.2s ease-in-out infinite;
    }

    .poem-text::-webkit-scrollbar {
      width: 3px;
    }

    .poem-text::-webkit-scrollbar-track {
      background: transparent;
    }

    .poem-text::-webkit-scrollbar-thumb {
      background: var(--accent, rgba(244,114,182,0.45));
      border-radius: 99px;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <!-- YouTube IFrame API player (fora da tela) -->
  <div id="yt-player" style="position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;"></div>

  <button id="music-btn" title="Música">🎵</button>

  <!-- ══════════════════════ GAME SCREEN ══════════════════════ -->
  <div id="game-screen">
    <canvas id="stars-canvas"></canvas>
    <div id="strawberry">🍎</div>
    <button id="open-btn">Abra os seus poemas 💌</button>
    <span id="touch-hint">toque na maçã</span>
  </div>

  <!-- ══════════════════════ CAROUSEL SCREEN ══════════════════════ -->
  <div id="carousel-screen">
    <canvas id="stars-canvas-2"></canvas>
    <div id="lily-container"></div>
    <div class="carousel-wrapper">
      <div class="poem-card" id="poem-card">
        <div class="poem-icon"  id="poem-icon">🍎</div>
        <div class="poem-title" id="poem-title">Poema 1</div>
        <div class="poem-text"  id="poem-text">Poema 1</div>
      </div>

      <!-- Card final — aparece após o último poema -->
      <div class="poem-card" id="final-card">
        <div class="final-big-icon">💌</div>
        <div class="final-name">Sophia</div>

        <img src="foto.jpg" alt="nós dois"
          style="width:clamp(110px,32vw,160px);height:clamp(110px,32vw,160px);border-radius:50%;object-fit:cover;object-position:center top;border:2px solid rgba(244,114,182,0.6);box-shadow:0 0 24px rgba(244,114,182,0.35);"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
        <div id="photo-placeholder" style="display:none">📸</div>

        <div class="final-msg">Feliz Dia dos Namorados 💕</div>
      </div>

      <div class="nav-row">
        <button class="nav-btn" id="prev-btn">← Anterior</button>
        <span class="counter"   id="counter">1 / 5</span>
        <button class="nav-btn" id="next-btn">Próximo →</button>
      </div>
    </div>
  </div>

  <script>
    /* ════════════════════════════════════════════════════════════════
       TEMAS DE COR  (cores favoritas dela, em ordem)
       theme: 0=rosa  1=preto  2=azul  3=roxo
    ════════════════════════════════════════════════════════════════ */
    const THEMES = [
      { accent: '#f472b6', glow: 'rgba(244,114,182,0.18)', border: 'rgba(244,114,182,0.28)', cardBg: 'rgba(255,255,255,0.05)' }, // rosa
      { accent: '#e2e8f0', glow: 'rgba(226,232,240,0.10)', border: 'rgba(226,232,240,0.20)', cardBg: 'rgba(0,0,0,0.35)'       }, // preto
      { accent: '#60a5fa', glow: 'rgba(96,165,250,0.18)',  border: 'rgba(96,165,250,0.28)',  cardBg: 'rgba(255,255,255,0.05)' }, // azul
      { accent: '#a78bfa', glow: 'rgba(167,139,250,0.18)', border: 'rgba(167,139,250,0.28)', cardBg: 'rgba(255,255,255,0.05)' }, // roxo
    ];

    /* ════════════════════════════════════════════════════════════════
       POEMAS — adicione ou remova objetos à vontade, sem limite.
       icon   → emoji no topo do card
       title  → título em destaque
       text   → corpo do poema (\n = quebra de linha)
       theme  → índice da cor: 0=rosa 1=preto 2=azul 3=roxo
    ════════════════════════════════════════════════════════════════ */
    const poems = [
      {
        icon:  '💚',
        title: 'Verde e Mel',
        text:  'Seus olhos são verdes, e na luz ficam mel,\ne eu me perco neles sem querer.\nEu amo seu rosto e seu jeito de ser,\ne a paz que sinto só de te ver.',
        theme: 0  // rosa
      },
      {
        icon:  '🌅',
        title: 'Desde Aquele Domingo',
        text:  'Segundas me quebraram,\nTerças me deixaram sem esperança.\nNa quarta eu fui atrás de algo bom,\ne quinta começou a melhorar.\nSexta eu já tava bem, só de saber que ia te ver,\nSábado eu queimei como uma fogueira por você.\nLembra de quando a gente se conheceu naquele domingo?\nFoi quando os meus dias passaram a fazer sentido.',
        theme: 2  // azul
      },
      {
        icon:  '🌸',
        title: 'Mais que Flores',
        text:  'Flores nem se comparam à sua beleza,\nperto do teu sorriso, o mundo para.\nA vida é difícil, eu sei que é,\nmas ao seu lado até segunda-feira eu aguento.',
        theme: 3  // roxo
      },
      {
        icon:  '🌙',
        title: 'A Melhor Parte do Dia',
        text:  'Temos longas conversas à noite e isso é incrível,\ntorna meu dia menos corrido.\nDepois de chegar do trabalho, sabe o que eu quero?\nFicar boba olhando pra tela,\ne cada mensagem sua eu espero.',
        theme: 1  // preto
      },
      {
        icon:  '❤️',
        title: 'Mais que um Poema',
        text:  'Oi! Sei que você esperava um poema aqui, mas não é isso.\n\nQueria deixar essa parte pra te dizer que eu te amo muito e que você pode contar comigo para todos os momentos.\nRuins, bons, tristes e felizes.\nNão importa.\nSempre vou estar com você.\n\nDa sua querida princesa,\nMelissa ❤️',
        theme: 0  // rosa
      },
      /* ── Para adicionar mais poemas, copie o bloco abaixo: ──────
      {
        icon:  '🌹',
        title: 'Título',
        text:  'Escreva seu\npoema aqui',
        theme: 1
      },
      ─────────────────────────────────────────────────────────── */
    ];

    /* ════════════════════════════════════════════════════════════════
       MÚSICA DE FUNDO — YouTube IFrame API
       Para trocar a música, substitua o VIDEO_ID abaixo pelo ID do
       vídeo do YouTube (parte depois de "v=" na URL).
    ════════════════════════════════════════════════════════════════ */
    const VIDEO_ID = 'Ou3SkdzJui8';

    const musicBtn = document.getElementById('music-btn');
    let ytPlayer     = null;
    let musicStarted = false;
    let muted        = false;
    let playerReady  = false;

    // Callback definido ANTES de carregar o script da API
    window.onYouTubeIframeAPIReady = function () {
      ytPlayer = new YT.Player('yt-player', {
        videoId: VIDEO_ID,
        playerVars: {
          autoplay:    0,
          loop:        1,
          playlist:    VIDEO_ID,
          playsinline: 1,
          controls:    0,
          disablekb:   1,
          fs:          0,
          rel:         0,
          mute:        0
        },
        events: {
          onReady: function () {
            playerReady = true;
            ytPlayer.setVolume(50);
            if (musicStarted) ytPlayer.playVideo();
          }
        }
      });
    };

    // Carrega o script depois que o callback já está definido
    (function () {
      const s = document.createElement('script');
      s.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(s);
    })();

    function startMusic() {
      if (musicStarted) return;
      musicStarted = true;
      musicBtn.classList.add('visible');
      if (playerReady) ytPlayer.playVideo();
    }

    musicBtn.addEventListener('click', () => {
      muted = !muted;
      if (muted) { ytPlayer && ytPlayer.mute();   musicBtn.textContent = '🔇'; }
      else       { ytPlayer && ytPlayer.unMute(); musicBtn.textContent = '🎵'; }
    });

    /* ════════════════════════════════════════════════════════════════
       ESTRELAS
    ════════════════════════════════════════════════════════════════ */
    function initStars(canvas) {
      const ctx = canvas.getContext('2d');
      let stars = [];

      function resize() {
        canvas.width  = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        buildStars();
      }

      function buildStars() {
        const count = Math.floor((canvas.width * canvas.height) / 3800);
        stars = Array.from({ length: count }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.5 + 0.3,
          a: Math.random(),
          speed: Math.random() * 0.004 + 0.001,
          phase: Math.random() * Math.PI * 2
        }));
      }

      let raf;
      function draw(t) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(s => {
          const alpha = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * s.speed * 60 + s.phase));
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${alpha * s.a})`;
          ctx.fill();
        });
        raf = requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      resize();
      raf = requestAnimationFrame(draw);
    }

    initStars(document.getElementById('stars-canvas'));
    initStars(document.getElementById('stars-canvas-2'));

    /* ════════════════════════════════════════════════════════════════
       MINI-GAME
    ════════════════════════════════════════════════════════════════ */
    const strawberry = document.getElementById('strawberry');
    const openBtn    = document.getElementById('open-btn');
    const touchHint  = document.getElementById('touch-hint');
    const gameScreen = document.getElementById('game-screen');

    const MAX_TOUCHES = 5;
    let touchCount = 0;
    let isMoving   = false;

    function getStrawberrySize() {
      return parseFloat(getComputedStyle(strawberry).fontSize) * 1.2;
    }

    function moveStrawberry() {
      const margin = getStrawberrySize();
      const maxX = window.innerWidth  - margin * 2;
      const maxY = window.innerHeight - margin * 2;
      const x = margin + Math.random() * maxX;
      const y = margin + Math.random() * maxY;
      strawberry.style.left      = x + 'px';
      strawberry.style.top       = y + 'px';
      strawberry.style.transform = 'translate(-50%, -50%)';
    }

    function spawnHeart(x, y) {
      const el = document.createElement('span');
      el.className   = 'heart';
      el.textContent = ['💕','💗','💓','✨'][Math.floor(Math.random() * 4)];
      el.style.left            = (x - 10) + 'px';
      el.style.top             = (y - 10) + 'px';
      el.style.animationDuration = (0.8 + Math.random() * 0.5) + 's';
      gameScreen.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }

    function onStrawberryTouch(e) {
      e.preventDefault();
      if (isMoving) return;
      isMoving = true;

      startMusic();

      const touch = e.touches ? e.touches[0] : e;
      spawnHeart(touch.clientX, touch.clientY);

      touchCount++;
      if (touchCount < MAX_TOUCHES) {
        touchHint.textContent = `mais ${MAX_TOUCHES - touchCount}x…`;
        moveStrawberry();
        setTimeout(() => { isMoving = false; }, 120);
      } else {
        strawberry.style.transition = 'opacity 0.3s, transform 0.3s';
        strawberry.style.opacity    = '0';
        strawberry.style.transform  = 'translate(-50%, -50%) scale(0)';
        touchHint.style.animation   = 'none';
        touchHint.style.opacity     = '0';
        setTimeout(() => {
          strawberry.style.display = 'none';
          openBtn.classList.add('visible');
          isMoving = false;
        }, 350);
      }
    }

    // Usa pointer events para evitar disparo duplo em tablets híbridos
    strawberry.addEventListener('pointerdown', onStrawberryTouch);

    window.addEventListener('load', moveStrawberry);
    moveStrawberry();

    /* ════════════════════════════════════════════════════════════════
       TRANSIÇÃO PARA O CARROSSEL
    ════════════════════════════════════════════════════════════════ */
    const carouselScreen = document.getElementById('carousel-screen');

    openBtn.addEventListener('click', () => {
      startMusic();
      gameScreen.classList.add('hidden');
      carouselScreen.classList.add('visible');
      renderPoem(0, null);
    });

    /* ════════════════════════════════════════════════════════════════
       CARROSSEL
    ════════════════════════════════════════════════════════════════ */
    const poemCard  = document.getElementById('poem-card');
    const poemIcon  = document.getElementById('poem-icon');
    const poemTitle = document.getElementById('poem-title');
    const poemText  = document.getElementById('poem-text');
    const counter   = document.getElementById('counter');
    const prevBtn   = document.getElementById('prev-btn');
    const nextBtn   = document.getElementById('next-btn');

    let current    = 0;
    let animating  = false;
    let generation = 0; // incremented on each navigation to invalidate stale listeners

    function applyTheme(poem) {
      const t = THEMES[poem.theme ?? 0];
      poemCard.style.setProperty('--accent',  t.accent);
      poemCard.style.setProperty('--glow',    t.glow);
      poemCard.style.setProperty('--border',  t.border);
      poemCard.style.setProperty('--card-bg', t.cardBg);
    }

    function renderPoem(index, direction) {
      const poem = poems[index];

      if (direction === null) {
        poemIcon.textContent  = poem.icon;
        poemTitle.textContent = poem.title;
        poemText.textContent  = poem.text;
        counter.textContent   = `${index + 1} / ${poems.length}`;
        applyTheme(poem);
        updateNavBtns(index);
        return;
      }

      if (animating) return;
      animating = true;
      const myGen = ++generation; // captura geração atual para invalidar listeners antigos

      const outClass = direction === 'next' ? 'slide-out-left'  : 'slide-out-right';
      const inClass  = direction === 'next' ? 'slide-in-right'  : 'slide-in-left';

      // Fallback: libera o travamento se animationend não disparar
      const safety = setTimeout(() => {
        if (generation === myGen) animating = false;
      }, 700);

      poemCard.classList.add(outClass);
      poemCard.addEventListener('animationend', function handler(e) {
        if (e.target !== poemCard) return;
        if (generation !== myGen) { poemCard.removeEventListener('animationend', handler); return; }
        poemCard.classList.remove(outClass);
        poemCard.removeEventListener('animationend', handler);

        poemIcon.textContent  = poem.icon;
        poemTitle.textContent = poem.title;
        poemText.textContent  = poem.text;
        counter.textContent   = `${index + 1} / ${poems.length}`;
        applyTheme(poem);
        updateNavBtns(index);

        poemCard.classList.add(inClass);
        poemCard.addEventListener('animationend', function h2(e) {
          if (e.target !== poemCard) return;
          if (generation !== myGen) { poemCard.removeEventListener('animationend', h2); return; }
          poemCard.classList.remove(inClass);
          poemCard.removeEventListener('animationend', h2);
          clearTimeout(safety);
          animating = false;
        });
      });
    }

    function updateNavBtns(index) {
      prevBtn.disabled = index === 0;
      nextBtn.disabled = false;
      nextBtn.textContent = index === poems.length - 1 ? 'Finalizar ✨' : 'Próximo →';
    }

    /* ════════════════════════════════════════════════════════════════
       CARD FINAL
    ════════════════════════════════════════════════════════════════ */
    const finalCard = document.getElementById('final-card');
    let showingFinal = false;

    function showFinalCard() {
      if (animating || showingFinal) return;
      animating = true;
      showingFinal = true;
      const myGen = ++generation;

      poemCard.classList.add('slide-out-left');
      poemCard.addEventListener('animationend', function h(e) {
        if (e.target !== poemCard) return;
        if (generation !== myGen) { poemCard.removeEventListener('animationend', h); return; }
        poemCard.classList.remove('slide-out-left');
        poemCard.removeEventListener('animationend', h);
        poemCard.style.display = 'none';

        finalCard.style.display = 'flex';
        finalCard.classList.add('slide-in-right');
        finalCard.addEventListener('animationend', function h2(e) {
          if (e.target !== finalCard) return;
          finalCard.classList.remove('slide-in-right');
          finalCard.removeEventListener('animationend', h2);
          animating = false;
          launchConfetti();
        });

        nextBtn.style.visibility = 'hidden';
        prevBtn.disabled = false;
        counter.textContent = '💌';
      });
    }

    function hideFinalCard() {
      if (animating) return;
      animating = true;
      showingFinal = false;
      const myGen = ++generation;

      finalCard.classList.add('slide-out-right');
      finalCard.addEventListener('animationend', function h(e) {
        if (e.target !== finalCard) return;
        if (generation !== myGen) { finalCard.removeEventListener('animationend', h); return; }
        finalCard.classList.remove('slide-out-right');
        finalCard.removeEventListener('animationend', h);
        finalCard.style.display = 'none';

        poemCard.style.display = 'flex';
        poemCard.classList.add('slide-in-left');
        poemCard.addEventListener('animationend', function h2(e) {
          if (e.target !== poemCard) return;
          poemCard.classList.remove('slide-in-left');
          poemCard.removeEventListener('animationend', h2);
          animating = false;
        });

        nextBtn.style.visibility = 'visible';
        counter.textContent = `${current + 1} / ${poems.length}`;
        updateNavBtns(current);
      });
    }

    function launchConfetti() {
      const pieces = ['💕','💗','💜','💙','✨','🌸','💌'];
      for (let i = 0; i < 45; i++) {
        setTimeout(() => {
          const el = document.createElement('span');
          el.className = 'confetti-piece';
          el.textContent = pieces[Math.floor(Math.random() * pieces.length)];
          el.style.left     = Math.random() * 100 + 'vw';
          el.style.fontSize = (13 + Math.random() * 14) + 'px';
          el.style.animationDuration = (1.4 + Math.random() * 1.8) + 's';
          el.style.animationDelay    = '0s';
          document.body.appendChild(el);
          el.addEventListener('animationend', () => el.remove());
        }, i * 55);
      }
    }

    prevBtn.addEventListener('click', () => {
      if (showingFinal)                    { hideFinalCard(); return; }
      if (current > 0 && !animating) { current--; renderPoem(current, 'prev'); }
    });

    nextBtn.addEventListener('click', () => {
      if (current === poems.length - 1 && !animating) { showFinalCard(); return; }
      if (current < poems.length - 1  && !animating)  { current++; renderPoem(current, 'next'); }
    });

    // Swipe nos poemas
    let swipeStartX = 0;
    function onSwipeStart(e) { swipeStartX = (e.touches || [e])[0].clientX; }
    function onSwipeEnd(e) {
      const dx = (e.changedTouches || [e])[0].clientX - swipeStartX;
      if (Math.abs(dx) < 50) return;
      if (showingFinal) {
        if (dx > 0) hideFinalCard();
        return;
      }
      if (dx < 0 && !animating) {
        if (current < poems.length - 1) { current++; renderPoem(current, 'next'); }
        else { showFinalCard(); }
      } else if (dx > 0 && current > 0 && !animating) {
        current--; renderPoem(current, 'prev');
      }
    }
    poemCard.addEventListener('touchstart',  onSwipeStart, { passive: true });
    poemCard.addEventListener('touchend',    onSwipeEnd,   { passive: true });
    finalCard.addEventListener('touchstart', onSwipeStart, { passive: true });
    finalCard.addEventListener('touchend',   onSwipeEnd,   { passive: true });

    /* ════════════════════════════════════════════════════════════════
       LÍRIOS NO FUNDO
    ════════════════════════════════════════════════════════════════ */
    function lilysvg() {
      return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <g transform="translate(50,50)">
          <ellipse rx="9" ry="32" fill="#ffadd2" transform="rotate(0)   translate(0,-16)"/>
          <ellipse rx="9" ry="32" fill="#ff85b3" transform="rotate(60)  translate(0,-16)"/>
          <ellipse rx="9" ry="32" fill="#ffadd2" transform="rotate(120) translate(0,-16)"/>
          <ellipse rx="9" ry="32" fill="#ff85b3" transform="rotate(180) translate(0,-16)"/>
          <ellipse rx="9" ry="32" fill="#ffadd2" transform="rotate(240) translate(0,-16)"/>
          <ellipse rx="9" ry="32" fill="#ff85b3" transform="rotate(300) translate(0,-16)"/>
          <circle r="6" fill="#f472b6"/>
          <line x1="0" y1="-6" x2="0"   y2="-22" stroke="#fbbf24" stroke-width="1.5"/>
          <circle cy="-24" r="2.5" fill="#fbbf24"/>
          <line x1="0" y1="-6" x2="13"  y2="-17" stroke="#fbbf24" stroke-width="1.5"/>
          <circle cx="15"  cy="-19" r="2.5" fill="#fbbf24"/>
          <line x1="0" y1="-6" x2="-13" y2="-17" stroke="#fbbf24" stroke-width="1.5"/>
          <circle cx="-15" cy="-19" r="2.5" fill="#fbbf24"/>
          <line x1="0" y1="-6" x2="20"  y2="-6"  stroke="#fbbf24" stroke-width="1.5"/>
          <circle cx="22"  cy="-6"  r="2.5" fill="#fbbf24"/>
          <line x1="0" y1="-6" x2="-20" y2="-6"  stroke="#fbbf24" stroke-width="1.5"/>
          <circle cx="-22" cy="-6"  r="2.5" fill="#fbbf24"/>
          <line x1="0" y1="-6" x2="13"  y2="6"   stroke="#fbbf24" stroke-width="1.5"/>
          <circle cx="15"  cy="7"   r="2.5" fill="#fbbf24"/>
        </g>
      </svg>`;
    }

    function initLilies() {
      const container = document.getElementById('lily-container');
      const lilies = [
        { x: 5,  y: 8,  size: 80,  op: 0.10, r: 15,  dur: 6.5 },
        { x: 82, y: 5,  size: 60,  op: 0.08, r: -20, dur: 7.2 },
        { x: 88, y: 72, size: 90,  op: 0.09, r: 35,  dur: 8.1 },
        { x: 3,  y: 78, size: 70,  op: 0.11, r: -10, dur: 5.8 },
        { x: 45, y: 3,  size: 50,  op: 0.07, r: 50,  dur: 9.0 },
        { x: 60, y: 88, size: 65,  op: 0.09, r: -40, dur: 6.8 },
        { x: 20, y: 45, size: 44,  op: 0.06, r: 25,  dur: 7.5 },
        { x: 75, y: 38, size: 55,  op: 0.07, r: -55, dur: 8.4 },
        { x: 30, y: 90, size: 48,  op: 0.08, r: 70,  dur: 6.2 },
        { x: 92, y: 45, size: 40,  op: 0.06, r: -30, dur: 9.5 },
        { x: 50, y: 55, size: 36,  op: 0.05, r: 10,  dur: 7.8 },
        { x: 15, y: 20, size: 42,  op: 0.07, r: -65, dur: 8.7 },
      ];

      lilies.forEach((l, i) => {
        const el = document.createElement('div');
        el.className = 'lily';
        el.style.cssText = `
          left:${l.x}%;top:${l.y}%;
          --size:${l.size}px;--op:${l.op};--r:${l.r}deg;
          animation-duration:${l.dur}s;
          animation-delay:${-(i * 0.7)}s;
        `;
        el.innerHTML = lilysvg();
        container.appendChild(el);
      });
    }

    initLilies();
  </script>
</body>
